name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Core and CLI regression checks
        run: node --test tests/core.test.mjs
      - name: CLI example and normalization roundtrip
        run: |
          node cli.mjs analyze examples/partial.json
          node cli.mjs normalize examples/repeated.json > "$RUNNER_TEMP/overlap-normalized.json"
          node cli.mjs analyze "$RUNNER_TEMP/overlap-normalized.json"
